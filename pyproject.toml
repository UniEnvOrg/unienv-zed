[project]
name = "unienv_zed"
version = "0.0.1a1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">= 3.10"
dependencies = [
    "unienv>=0.0.1b16",
    "numpy",
    "pyzed>=5.0"
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/unienv-zed"
Documentation = "https://github.com/UniEnvOrg/unienv-zed"
Repository = "https://github.com/UniEnvOrg/unienv-zed"
Issues = "https://github.com/UniEnvOrg/unienv-zed/issues"
Changelog = "https://github.com/UniEnvOrg/unienv-zed/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
